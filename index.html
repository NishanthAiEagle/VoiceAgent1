<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Spice Bistro — Voice Assistant</title>
<style>
  :root {
    --ink: #2b1a14;
    --cream: #faf3e7;
    --turmeric: #d99a1b;
    --turmeric-deep: #b87e12;
    --maroon: #6e1f2b;
    --maroon-deep: #551621;
    --line: rgba(43,26,20,0.12);
    --panel: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }

  .brandmark {
    width: 100%;
    max-width: 560px;
    text-align: center;
    margin-bottom: 22px;
  }

  .brandmark .kicker {
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--turmeric-deep);
    margin-bottom: 6px;
  }

  .brandmark h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 34px;
    font-weight: 600;
    margin: 0;
    line-height: 1.15;
  }

  .brandmark p {
    margin: 10px 0 0;
    color: rgba(43,26,20,0.65);
    font-size: 15px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 18px 40px -24px rgba(110,31,43,0.35);
    overflow: hidden;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #fffdf9, #fff);
  }

  .toolbar label {
    font-size: 12px;
    color: rgba(43,26,20,0.55);
    margin-right: 6px;
  }

  select#langSelect {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--cream);
    color: var(--ink);
    padding: 7px 30px 7px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%232b1a14'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
  }

  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(43,26,20,0.55);
  }

  .status-dot .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #9aa08c;
  }

  .status-dot.ready .dot { background: #4c8c5c; }
  .status-dot.busy .dot { background: var(--turmeric); animation: pulse 1s infinite; }
  .status-dot.error .dot { background: var(--maroon); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  #log {
    height: 400px;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--cream);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--maroon);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.system {
    align-self: center;
    background: transparent;
    color: rgba(43,26,20,0.45);
    font-size: 12px;
    padding: 2px 8px;
  }

  .composer {
    border-top: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fffdf9;
  }

  #textInput {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 11px 16px;
    font-size: 14px;
    outline: none;
    background: var(--panel);
  }

  #textInput:focus {
    border-color: var(--turmeric);
  }

  button.round {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  button.round:active { transform: scale(0.94); }

  #sendBtn {
    background: var(--maroon);
    color: #fff;
  }
  #sendBtn:hover { background: var(--maroon-deep); }

  #micBtn {
    background: var(--turmeric);
    color: #2b1a14;
  }
  #micBtn:hover { background: var(--turmeric-deep); }

  #micBtn.listening {
    background: var(--maroon);
    color: #fff;
    box-shadow: 0 0 0 6px rgba(110,31,43,0.14);
  }

  .quick-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px 14px;
    background: #fffdf9;
  }

  .quick-row button {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  .quick-row button:hover {
    border-color: var(--turmeric);
    color: var(--turmeric-deep);
  }

  .setup-note {
    width: 100%;
    max-width: 560px;
    margin-top: 14px;
    font-size: 12px;
    color: rgba(43,26,20,0.5);
    text-align: center;
  }

  .setup-note code {
    background: rgba(43,26,20,0.06);
    padding: 1px 5px;
    border-radius: 4px;
  }

  @media (max-width: 420px) {
    .brandmark h1 { font-size: 27px; }
    #log { height: 340px; }
  }
</style>
</head>
<body>

  <div class="brandmark">
    <div class="kicker">THE SPICE BISTRO</div>
    <h1>Talk to your table, before you sit at one.</h1>
    <p>Ask about the menu, opening hours, or reserve a table — by voice or by typing.</p>
  </div>

  <div class="card">
    <div class="toolbar">
      <div>
        <label for="langSelect">Language</label>
        <select id="langSelect">
          <option value="en">English</option>
          <option value="ta">தமிழ் (Tamil)</option>
          <option value="hi">हिंदी (Hindi)</option>
          <option value="ml">മലയാളം (Malayalam)</option>
          <option value="kn">ಕನ್ನಡ (Kannada)</option>
          <option value="te">తెలుగు (Telugu)</option>
        </select>
      </div>
      <div class="status-dot ready" id="statusDot">
        <span class="dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </div>

    <div id="log"></div>

    <div class="quick-row">
      <button data-q="Book a table">Book a table</button>
      <button data-q="What are your opening hours?">Opening hours</button>
      <button data-q="What do you recommend?">Recommend a dish</button>
    </div>

    <div class="composer">
      <button class="round" id="micBtn" title="Speak">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <input type="text" id="textInput" placeholder="Type your message…" autocomplete="off">
      <button class="round" id="sendBtn" title="Send">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 16-3-7-7-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div class="setup-note">
    Before this works, paste your deployed Apps Script Web App URL into <code>SCRIPT_URL</code> near the top of the script below.
  </div>

<script>
  // ======================================================
  // CONFIG — paste your deployed Apps Script Web App URL here
  // (Deploy → New deployment → Web app → copy the /exec URL)
  // ======================================================
  const SCRIPT_URL = "PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE";

  // ------------------------------------------------------
  // Conversation state
  // ------------------------------------------------------
  let state = "idle";
  let context = {};
  let jsonpCounter = 0;

  const logEl = document.getElementById("log");
  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("micBtn");
  const langSelect = document.getElementById("langSelect");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  const WELCOME = {
    en: "Welcome to The Spice Bistro! Ask about dishes, opening hours, or reserve a table.",
    ta: "தி ஸ்பைஸ் பிஸ்ட்ரோவிற்கு நல்வரவு! உணவுகள் பற்றி கேட்கலாம் அல்லது மேஜை பதிவு செய்யலாம்.",
    hi: "द स्पाइस बिस्ट्रो में आपका स्वागत है! खाने की जानकारी लें या टेबल बुक करें।",
    ml: "ദ സ്പൈസ് ബിസ്ട്രോയിലേക്ക് സ്വാഗതം! ഭക്ഷണങ്ങളെക്കുറിച്ചറിയാനും ടേബിൾ ബുക്ക് ചെയ്യാനും ചോദിക്കൂ.",
    kn: "ದಿ ಸ್ಪೈಸ್ ಬಿಸ್ಟ್ರೋಗೆ ಸುಸ್ವಾಗತ! ಆಹಾರದ ವಿವರಗಳನ್ನು ಕೇಳಿ ಅಥವಾ ಟೇಬಲ್ ಬುಕ್ ಮಾಡಿ.",
    te: "ది స్పైస్ బిస్ట్రోకి స్వాగతం! వంటకాల గురించి తెలుసుకోండి లేదా టేబుల్ బుక్ చేసుకోండి."
  };

  const SPEECH_LOCALE = {
    en: "en-US", ta: "ta-IN", hi: "hi-IN", ml: "ml-IN", kn: "kn-IN", te: "te-IN"
  };

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addSystemNote(text) {
    const div = document.createElement("div");
    div.className = "msg system";
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(mode, label) {
    statusDot.className = "status-dot " + mode;
    statusText.textContent = label;
  }

  function speak(text, lang) {
    if (!("speechSynthesis" in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = SPEECH_LOCALE[lang] || "en-US";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  // JSONP call to the Apps Script backend (avoids CORS entirely)
  function callBackend(text, lang) {
    return new Promise((resolve, reject) => {
      if (!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
        reject(new Error("SCRIPT_URL is not configured yet."));
        return;
      }

      const cbName = "__spiceBistroCb" + (jsonpCounter++);
      const script = document.createElement("script");

      const cleanup = () => {
        delete window[cbName];
        script.remove();
      };

      window[cbName] = (data) => {
        cleanup();
        resolve(data);
      };

      script.onerror = () => {
        cleanup();
        reject(new Error("Network or script error contacting backend."));
      };

      const params = new URLSearchParams({
        text: text,
        state: state,
        context: JSON.stringify(context),
        lang: lang,
        callback: cbName
      });

      script.src = SCRIPT_URL + "?" + params.toString();
      document.body.appendChild(script);

      // Safety timeout in case the callback never fires
      setTimeout(() => {
        if (window[cbName]) {
          cleanup();
          reject(new Error("Request timed out."));
        }
      }, 15000);
    });
  }

  async function sendMessage(rawText) {
    const text = (rawText || "").trim();
    if (!text) return;

    const lang = langSelect.value;
    addMessage(text, "user");
    textInput.value = "";
    setStatus("busy", "Thinking…");

    try {
      const data = await callBackend(text, lang);
      state = data.nextState || "idle";
      context = data.context || {};
      addMessage(data.reply, "bot");
      speak(data.reply, lang);
      setStatus("ready", "Ready");
    } catch (err) {
      console.error(err);
      addMessage("Sorry, I couldn't reach the restaurant's assistant just now. Please try again in a moment.", "bot");
      setStatus("error", "Connection issue");
    }
  }

  sendBtn.addEventListener("click", () => sendMessage(textInput.value));
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage(textInput.value);
  });

  document.querySelectorAll(".quick-row button").forEach((btn) => {
    btn.addEventListener("click", () => sendMessage(btn.dataset.q));
  });

  langSelect.addEventListener("change", () => {
    logEl.innerHTML = "";
    state = "idle";
    context = {};
    addMessage(WELCOME[langSelect.value] || WELCOME.en, "bot");
  });

  // ------------------------------------------------------
  // Voice input (Web Speech API — Chrome/Edge only)
  // ------------------------------------------------------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let listening = false;

  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.continuous = false;
    recognizer.interimResults = false;

    recognizer.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      sendMessage(transcript);
    };

    recognizer.onend = () => {
      listening = false;
      micBtn.classList.remove("listening");
    };

    recognizer.onerror = (event) => {
      listening = false;
      micBtn.classList.remove("listening");
      addSystemNote("Voice input error: " + event.error);
    };

    micBtn.addEventListener("click", () => {
      if (listening) {
        recognizer.stop();
        return;
      }
      recognizer.lang = SPEECH_LOCALE[langSelect.value] || "en-US";
      try {
        recognizer.start();
        listening = true;
        micBtn.classList.add("listening");
      } catch (err) {
        addSystemNote("Could not start microphone: " + err.message);
      }
    });
  } else {
    micBtn.disabled = true;
    micBtn.title = "Voice input not supported in this browser";
    micBtn.style.opacity = "0.4";
  }

  // ------------------------------------------------------
  // Initial greeting
  // ------------------------------------------------------
  addMessage(WELCOME.en, "bot");

  if (!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
    setStatus("error", "Backend not configured");
    addSystemNote("Set SCRIPT_URL in the code to your deployed Apps Script Web App link to go live.");
  }
</script>

</body>
</html>
